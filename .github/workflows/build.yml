name: Build

on:
  push:
    branches: [ "main, v0.3.0" ]
  pull_request:
    branches: [ "main, v0.3.0" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # Wrapper (gradle/wrapper/gradle-wrapper.jar + gradle-wrapper.properties + gradlew) is
      # committed, so this uses `gradle/actions/setup-gradle` purely for its dependency/build
      # caching and calls `./gradlew` - the Gradle version actually used is whatever
      # gradle-wrapper.properties pins (currently 9.5.1), not the action's own default.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RLScoreboard
          path: build/libs/RLScoreboard-*.jar
