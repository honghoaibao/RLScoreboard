# Default example board. Feel free to edit, delete, or add as many more
# scoreboards/*.yml files as you want - RLScoreboard loads every file in this
# folder and lets the highest-priority board whose conditions pass win.
scoreboards:
  survival:
    enabled: true
    priority: 0
    fallback: true   # shown when no other board's conditions match

    title:
      text: "&6&lMY SERVER"
      animation:
        enabled: false
        interval: 5
        frames:
          - "&6&lMY SERVER"
          - "&e&lMY SERVER"
          - "&f&lMY SERVER"

    lines:
      - "&8&m----------------"
      - "&f👤 &7%rl_player_name%"
      - ""
      - "&b🌍 &7World: &f%rl_world%"
      - "&a👥 &7Online: &f%rl_online%&7/&f%rl_max_players%"
      # Per-line condition/animation example - only shows for players in creative mode.
      # Remove this whole entry if you don't need it; plain strings above are all you need
      # for the common case.
      - text: "&d✦ Creative mode"
        conditions:
          gamemode:
            - creative
      - ""
      - "&8&m----------------"

    update:
      interval: 5   # seconds

    conditions: {}
