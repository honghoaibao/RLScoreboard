# Default example board. Feel free to edit, delete, or add as many more
# scoreboards/*.yml files as you want - RLScoreboard loads every file in this
# folder and lets the highest-priority board whose conditions pass win.
#
# Layout below is deliberately minimal: one accent colour for the header (&6), muted
# grey labels (&7) with white values (&f), a blank line between groups instead of more
# separators, and only placeholders that are always available (no Vault/LuckPerms
# needed) so a fresh install never shows a raw unresolved %placeholder% - see the
# commented-out Money/Rank lines below for how to add those once you have the plugins
# that back them.
scoreboards:
  survival:
    enabled: true
    priority: 0
    fallback: true   # shown when no other board's conditions match

    title:
      text: "&6&lMY SERVER"
      animation:
        enabled: false
        interval: 5
        frames:
          - "&6&lMY SERVER"
          - "&e&lMY SERVER"
          - "&f&lMY SERVER"

    lines:
      - "&8&m----------------"
      - "&f%rl_player_name%"
      - ""
      - "&7Online: &f%rl_online%&7/&f%rl_max_players%"
      # Requires Vault + an economy plugin (adds the "rl_balance" placeholder):
      # - "&7Money: &f$%rl_balance%"
      # Requires LuckPerms (adds the "rl_rank" placeholder):
      # - "&7Rank: &f%rl_rank%"
      - ""
      - "&7World: &f%rl_world%"
      - "&7Ping: &f%rl_ping%ms"
      # Per-line condition example - only shows for players in creative mode. Remove
      # this whole entry if you don't need it; plain strings above are all you need
      # for the common case.
      - text: "&d✦ Creative mode"
        conditions:
          gamemode:
            - creative
      - ""
      - "&8&m----------------"

    update:
      interval: 5   # seconds

    conditions: {}
