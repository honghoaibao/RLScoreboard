# RLScoreboard - English (default) messages.
# Colour codes use '&' (and '&#RRGGBB' for hex). Tokens in {curly braces} are substituted
# by the plugin - keep them exactly as-is if you customise a line.
#
# This file is always used as the fallback for any key missing from another locale (e.g.
# locales/vi.yml), so it must contain every key the plugin can look up.

