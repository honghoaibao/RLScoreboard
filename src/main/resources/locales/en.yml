player_only: "&cThis command must be run in-game."

debug_active_board: "&7Active board: &f{board}"
debug_loaded_boards: "&7Loaded boards: &f{count}"
debug_loaded_leaderboards: "&7Loaded leaderboards: &f{count}"

board_list: "&7Boards: &f{boards}"
board_reload_success: "&aScoreboards reloaded."

leaderboard_list: "&7Leaderboards: &f{leaderboards}"
leaderboard_create_usage: "&cUsage: /rlscoreboard leaderboard create <id> [SIDEBAR|HOLOGRAM|TAB|NPC|GUI] [datasource]"
leaderboard_created: "&aCreated leaderboard '{id}'."
leaderboard_delete_usage: "&cUsage: /rlscoreboard leaderboard delete <id>"
leaderboard_deleted: "&aDeleted leaderboard '{id}'."
leaderboard_not_found: "&cNo leaderboard named '{id}'."
leaderboard_setlocation_usage: "&cUsage: /rlscoreboard leaderboard setlocation <id>"
