# Offline-inclusive version of topkills.yml - ranks EVERY player who has ever played, not
# just who's online right now. Requires `storage.enabled: true` in config.yml (off by
# default) - see README "Storage & offline leaderboards". Disabled here by default so it
# stays harmless (and silent, per section 4/24) on servers that haven't turned storage on.
leaderboards:
  topkills_alltime:
    enabled: false
    priority: 0

    display:
      type: SIDEBAR

    title:
      - "&c&l⚔ TOP KILLS (ALL-TIME)"

    datasource:
      type: topkills_alltime

    entries: 5

    update:
      interval: 60

    format:
      - "&e%position% &f%player%"
      - "&7%value% kills"

    top:
      1: "&6🥇"
      2: "&f🥈"
      3: "&c🥉"

    conditions: {}
