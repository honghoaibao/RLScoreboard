# Example HOLOGRAM leaderboard using the "economy" datasource. This datasource
# only becomes available if Vault *and* a compatible economy plugin are both
# installed (see VaultIntegration) - if not, this leaderboard simply never
# renders and nothing spams the console. Set its real position with:
#   /rlscoreboard leaderboard setlocation richest
leaderboards:
  richest:
    enabled: true

    display:
      type: HOLOGRAM

    title:
      - "&6&l🏆 TOP ĐẠI GIA"

    datasource:
      type: economy

    entries: 10

    update:
      interval: 60

    format:
      - "&e%position% &f%player%"
      - "&7%value% &6$"

    top:
      1: "&6🥇"
      2: "&f🥈"
      3: "&c🥉"

    # No location by default - set one with the command above before this
    # leaderboard will actually spawn its hologram.
    location: {}
